[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error
    # Environmental only: this Starlette build prefers the httpx2 client package
    # for its TestClient. The suite must run with no network, so we do not add a
    # dependency to silence it. Nothing in uc08/ raises this.
    ignore::starlette.exceptions.StarletteDeprecationWarning
