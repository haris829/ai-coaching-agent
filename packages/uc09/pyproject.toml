[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "uc09-session-summary"
version = "1.0.0"
description = "UC-09 Session Summary & Export - CPD evidence generation for a legal-education platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["uc09_summary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:uc09_summary.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # FastAPI dependency injection is declared in default arguments. This is
    # the framework idiom, not a mutable-default bug.
    "B008",
    # `blocks + [notice]` states the additive relationship the equivalence
    # tests are about far more plainly than an unpacked literal would.
    "RUF005",
    # Platform enums subclass (str, Enum) with an explicit __str__ so that the
    # serialised value is lowercase on every Python and every consumer.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Adapter boundaries deliberately catch broadly: every upstream failure, of
# whatever type, must become a typed contract error rather than escaping.
"uc09_summary/adapters/**" = ["BLE001"]
