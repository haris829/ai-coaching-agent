[project]
name = "courses-quiz-agent-backend"
version = "1.0.0"
description = "Courses Quiz Agent — UC-01 … UC-07: configuration, question bank, attempt delivery, scoring, certification, feedback and AI coaching"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    # UC-10's large-dataset checks. Marked so they can be skipped on a laptop and required in CI:
    # the requirement is that the dashboard performs correctly with 500+ attempts, and a test that
    # builds that dataset is slower than the rest of the suite by design.
    "performance: builds a large dataset to check aggregation at scale",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI dependency defaults are intentional

[tool.ruff.lint.per-file-ignores]
# Long lines are acceptable where they are data rather than logic: migration DDL, test payloads,
# and the human-readable check labels in the verification scripts.
"alembic/*" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
